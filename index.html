<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.yandex.ru" crossorigin />
    <link
      href="https://fonts.yandex.ru/catalog/inter/stylesheet.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="form-container">
      <h1 class="formName">Регистрация</h1>

      <p class="login-link">
        Уже есть аккаунт?
        <a href="#" class="enter">Войти</a>
      </p>

      <form action="#" method="post">
        <!-- Поле компании -->
        <div class="form-group">
          <label for="company" class="visually-hidden">Моя компания</label>
          <input
            type="text"
            name="company"
            id="company"
            placeholder="Моя компания"
            required
          />
        </div>

        <!-- Имя и Фамилия в одном контейнере (для размещения в одну строку) -->
        <div class="name-fields">
          <div class="form-group">
            <label for="firstName" class="visually-hidden">Имя</label>
            <input
              type="text"
              name="firstName"
              id="firstName"
              placeholder="Имя"
              required
            />
          </div>

          <div class="form-group">
            <label for="secondName" class="visually-hidden">Фамилия</label>
            <input
              type="text"
              name="secondName"
              id="secondName"
              placeholder="Фамилия"
              required
            />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="visually-hidden">E-mail</label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="E-mail"
            required
          />
        </div>

        <!-- Кнопка со стрелочкой (вместо input type="button") -->
        <button type="submit" class="submit-btn">
          Зарегистрироваться
          <img src="./images/arrow.png" alt="" aria-hidden="true" />
        </button>

        <!-- Чекбокс с label (улучшенная структура) -->
        <label class="checkbox-label">
          <input type="checkbox" name="checkbox" id="checkbox" required />
          <span
            >Я прочитал и принимаю
            <a href="#">Условия использования</a>
          </span>
        </label>
      </form>
    </div>
  </body>
</html>
